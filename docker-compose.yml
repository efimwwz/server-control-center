services:
  server-control-center:
    image: ghcr.io/efimwwz/server-control-center:${SCC_VERSION:-1.1.3}
    container_name: server-control-center
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      METRICS_PROVIDER: ${METRICS_PROVIDER:-agent}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - /run/scc-agent:/run/scc-agent:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

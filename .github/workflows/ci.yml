name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --tag server-control-center:ci .

      - name: Smoke test production container
        run: |
          set -euo pipefail
          cleanup() { docker rm -f scc-smoke-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name scc-smoke-test \
            -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e METRICS_PROVIDER=mock \
            server-control-center:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/scc-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const h=require("/tmp/scc-health.json"); if(h.status!=="ok" || h.version!=="1.1.1" || h.mode!=="mock") process.exit(1)'

          curl -fsS http://127.0.0.1:3000/api/system >/dev/null
          curl -fsS http://127.0.0.1:3000/api/docker >/dev/null
          curl -fsS http://127.0.0.1:3000/api/network >/dev/null
          curl -fsS http://127.0.0.1:3000/api/services >/dev/null
          curl -fsS -X POST http://127.0.0.1:3000/api/ai/analyze \
            -H 'Content-Type: application/json' \
            -d '{"question":"Give me a short server overview"}' >/dev/null

      - name: Test non-root access to the host-agent Unix socket
        run: |
          set -euo pipefail
          agent_dir="$(mktemp -d)"
          agent_pid=""
          cleanup() {
            docker rm -f scc-agent-socket-test >/dev/null 2>&1 || true
            if [[ -n "$agent_pid" ]]; then kill "$agent_pid" >/dev/null 2>&1 || true; fi
            rm -rf "$agent_dir"
          }
          trap cleanup EXIT

          sudo chown "$(id -u):0" "$agent_dir"
          chmod 0750 "$agent_dir"

          cat > "$agent_dir/mock_agent.py" <<'PY'
          import json
          import os
          import socketserver
          import sys
          from http.server import BaseHTTPRequestHandler

          payload = {
              "info": {"hostname": "ci-agent-host"},
              "cpu": {"usagePercent": 12.0},
              "ram": {"usagePercent": 25.0},
              "network": {"rxBytesSec": 1024, "txBytesSec": 512},
              "loadAvg": {"load1m": 0.1},
          }

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  pass

          server = socketserver.UnixStreamServer(sys.argv[1], Handler)
          os.chmod(sys.argv[1], 0o660)
          server.serve_forever()
          PY

          python3 "$agent_dir/mock_agent.py" "$agent_dir/agent.sock" >/tmp/scc-mock-agent.log 2>&1 &
          agent_pid=$!

          socket_ready=0
          for _ in $(seq 1 20); do
            if [[ -S "$agent_dir/agent.sock" ]]; then socket_ready=1; break; fi
            sleep 0.25
          done
          test "$socket_ready" -eq 1
          sudo chgrp 0 "$agent_dir/agent.sock"
          chmod 0660 "$agent_dir/agent.sock"

          docker run -d --name scc-agent-socket-test \
            -p 127.0.0.1:3001:3000 \
            -v "$agent_dir:/run/scc-agent:ro" \
            -e NODE_ENV=production \
            -e METRICS_PROVIDER=agent \
            server-control-center:ci

          test "$(docker exec scc-agent-socket-test id -u)" = "1000"
          test "$(docker exec scc-agent-socket-test id -g)" = "0"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/system -o /tmp/scc-agent-system.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const d=require("/tmp/scc-agent-system.json"); if(d.info?.hostname!=="ci-agent-host") process.exit(1)'

      - name: Check shell scripts
        run: bash -n install.sh deploy/install.sh deploy/uninstall.sh

      - name: Check Python agent syntax
        run: python3 -m py_compile deploy/host-agent/*.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --tag server-control-center:ci .

      - name: Smoke test production container
        run: |
          set -euo pipefail
          cleanup() { docker rm -f scc-smoke-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name scc-smoke-test \
            -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e METRICS_PROVIDER=mock \
            server-control-center:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/scc-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const h=require("/tmp/scc-health.json"); if(h.status!=="ok" || h.version!=="1.1.1" || h.mode!=="mock") process.exit(1)'

          curl -fsS http://127.0.0.1:3000/api/system >/dev/null
          curl -fsS http://127.0.0.1:3000/api/docker >/dev/null
          curl -fsS http://127.0.0.1:3000/api/network >/dev/null
          curl -fsS http://127.0.0.1:3000/api/services >/dev/null
          curl -fsS -X POST http://127.0.0.1:3000/api/ai/analyze \
            -H 'Content-Type: application/json' \
            -d '{"question":"Give me a short server overview"}' >/dev/null

      - name: Check shell scripts
        run: bash -n install.sh deploy/install.sh deploy/uninstall.sh

      - name: Check Python agent syntax
        run: python3 -m py_compile deploy/host-agent/*.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --tag server-control-center:ci .

      - name: Smoke test production container
        run: |
          set -euo pipefail
          cleanup() { docker rm -f scc-smoke-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name scc-smoke-test \
            -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e METRICS_PROVIDER=mock \
            server-control-center:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/scc-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const h=require("/tmp/scc-health.json"); if(h.status!=="ok" || h.version!=="1.1.1" || h.mode!=="mock") process.exit(1)'

          # Verify the SPA fallback handles both the root and client-side routes.
          for route in / /dashboard /docker /network /security /settings; do
            curl -fsS "http://127.0.0.1:3000$route" -o /tmp/scc-page.html
            grep -q '<div id="root"></div>' /tmp/scc-page.html
          done

          curl -fsS http://127.0.0.1:3000/api/system >/dev/null
          curl -fsS http://127.0.0.1:3000/api/docker >/dev/null
          curl -fsS http://127.0.0.1:3000/api/network >/dev/null
          curl -fsS http://127.0.0.1:3000/api/services >/dev/null
          curl -fsS http://127.0.0.1:3000/api/nginx >/dev/null
          curl -fsS http://127.0.0.1:3000/api/logs >/dev/null
          security_status="$(curl -sS -o /tmp/scc-security.json -w '%{http_code}' http://127.0.0.1:3000/api/security)"
          test "$security_status" = "503"
          node -e 'const d=require("/tmp/scc-security.json"); if(d.error!=="Security telemetry requires METRICS_PROVIDER=agent") process.exit(1)'
          curl -fsS -X POST http://127.0.0.1:3000/api/ai/analyze \
            -H 'Content-Type: application/json' \
            -d '{"question":"Give me a short server overview"}' >/dev/null

      - name: Test non-root access to the host-agent Unix socket
        run: |
          set -euo pipefail
          agent_dir="$(mktemp -d)"
          agent_pid=""
          cleanup() {
            docker rm -f scc-agent-socket-test >/dev/null 2>&1 || true
            if [[ -n "$agent_pid" ]]; then kill "$agent_pid" >/dev/null 2>&1 || true; fi
            rm -rf "$agent_dir"
          }
          trap cleanup EXIT

          sudo chown "$(id -u):0" "$agent_dir"
          chmod 0750 "$agent_dir"

          cat > "$agent_dir/mock_agent.py" <<'PY'
          import json
          import os
          import socketserver
          import sys
          from http.server import BaseHTTPRequestHandler

          payload = {
              "info": {"hostname": "ci-agent-host"},
              "cpu": {"usagePercent": 12.0},
              "ram": {"usagePercent": 25.0},
              "network": {"rxBytesSec": 1024, "txBytesSec": 512},
              "loadAvg": {"load1m": 0.1},
          }

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  pass

          server = socketserver.UnixStreamServer(sys.argv[1], Handler)
          os.chmod(sys.argv[1], 0o660)
          server.serve_forever()
          PY

          python3 "$agent_dir/mock_agent.py" "$agent_dir/agent.sock" >/tmp/scc-mock-agent.log 2>&1 &
          agent_pid=$!

          socket_ready=0
          for _ in $(seq 1 20); do
            if [[ -S "$agent_dir/agent.sock" ]]; then socket_ready=1; break; fi
            sleep 0.25
          done
          test "$socket_ready" -eq 1
          sudo chgrp 0 "$agent_dir/agent.sock"
          chmod 0660 "$agent_dir/agent.sock"

          docker run -d --name scc-agent-socket-test \
            -p 127.0.0.1:3001:3000 \
            -v "$agent_dir:/run/scc-agent:ro" \
            -e NODE_ENV=production \
            -e METRICS_PROVIDER=agent \
            server-control-center:ci

          test "$(docker exec scc-agent-socket-test id -u)" = "1000"
          test "$(docker exec scc-agent-socket-test id -g)" = "0"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/system -o /tmp/scc-agent-system.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e 'const d=require("/tmp/scc-agent-system.json"); if(d.info?.hostname!=="ci-agent-host") process.exit(1)'
          curl -fsS http://127.0.0.1:3001/api/security >/dev/null

      - name: Check shell scripts
        run: bash -n install.sh deploy/install.sh deploy/uninstall.sh

      - name: Check Python agent syntax
        run: python3 -m py_compile deploy/host-agent/*.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

  install-validation:
    name: Clean install and uninstall (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            uname: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            uname: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify fresh Ubuntu 24.04 host and prepare an unrelated container
        id: prepare
        run: |
          set -euo pipefail
          test "$( . /etc/os-release; printf '%s' "$VERSION_ID" )" = "24.04"
          test "$(uname -m)" = "${{ matrix.uname }}"
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"

          # GitHub-hosted runners are disposable VMs. Start their preinstalled
          # Docker service and create a sentinel to prove SCC leaves unrelated
          # workloads untouched.
          sudo systemctl start docker
          docker info >/dev/null
          docker run -d --name scc-launch-sentinel --restart unless-stopped \
            busybox:1.36 sh -c 'while true; do sleep 10; done'

          docker_started_at="$(sudo systemctl show docker.service -p ActiveEnterTimestampMonotonic --value)"
          echo "docker_started_at=$docker_started_at" >> "$GITHUB_OUTPUT"

      - name: Install the latest published SCC release
        id: install
        run: |
          set -euxo pipefail
          sudo bash ./install.sh

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o /tmp/scc-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          version="$(python3 -c 'import json; print(json.load(open("/tmp/scc-health.json"))["version"])')"
          python3 - "$version" <<'PY'
          import json, sys
          data = json.load(open("/tmp/scc-health.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("mode") == "agent", data
          assert data.get("version") == sys.argv[1], data
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

          sudo systemctl is-active --quiet scc-agent.service
          agent_socket_ready=0
          for _ in $(seq 1 40); do
            if sudo test -S /run/scc-agent/agent.sock; then
              agent_socket_ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "$agent_socket_ready" -ne 1 ]]; then
            sudo systemctl status scc-agent.service --no-pager || true
            sudo journalctl -u scc-agent.service -n 80 --no-pager || true
            exit 1
          fi
          test "$(docker inspect -f '{{.State.Health.Status}}' server-control-center)" = "healthy"

          curl -fsS http://127.0.0.1:3000/api/system -o /tmp/scc-system.json
          curl -fsS http://127.0.0.1:3000/api/docker -o /tmp/scc-docker.json
          python3 - <<'PY'
          import json
          system = json.load(open("/tmp/scc-system.json", encoding="utf-8"))
          docker = json.load(open("/tmp/scc-docker.json", encoding="utf-8"))
          assert system.get("info", {}).get("hostname"), system
          assert "containers" in docker, docker
          PY

          docker inspect --format '{{json .HostConfig.PortBindings}}' server-control-center > /tmp/scc-port-bindings.json
          python3 - <<'PY'
          import json
          bindings = json.load(open("/tmp/scc-port-bindings.json", encoding="utf-8"))
          ports = bindings.get("3000/tcp") or []
          assert any(item.get("HostIp") == "127.0.0.1" and item.get("HostPort") == "3000" for item in ports), bindings
          PY

          docker inspect scc-launch-sentinel >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' scc-launch-sentinel)" = "true"
          after_install="$(sudo systemctl show docker.service -p ActiveEnterTimestampMonotonic --value)"
          echo "Docker service monotonic start time before SCC: $DOCKER_STARTED_AT"
          echo "Docker service monotonic start time after SCC install: $after_install"
          test "$after_install" = "$DOCKER_STARTED_AT"
        env:
          DOCKER_STARTED_AT: ${{ steps.prepare.outputs.docker_started_at }}

      - name: Uninstall SCC and verify cleanup
        env:
          SCC_VERSION: ${{ steps.install.outputs.version }}
          DOCKER_STARTED_AT: ${{ steps.prepare.outputs.docker_started_at }}
        run: |
          set -euo pipefail
          printf '%s\n' 'REMOVE SERVER CONTROL CENTER' | sudo bash /opt/server-control-center/deploy/uninstall.sh

          test ! -e /opt/server-control-center
          test ! -e /opt/scc-agent
          test ! -e /etc/systemd/system/scc-agent.service
          test ! -e /run/scc-agent
          ! sudo systemctl is-active --quiet scc-agent.service
          ! docker ps -a --format '{{.Names}}' | grep -Fxq server-control-center
          ! curl -fsS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null 2>&1

          # The uninstall script leaves Docker itself, its images and unrelated
          # containers untouched.
          sudo systemctl is-active --quiet docker.service
          docker image inspect "ghcr.io/efimwwz/server-control-center:$SCC_VERSION" >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' scc-launch-sentinel)" = "true"
          after_uninstall="$(sudo systemctl show docker.service -p ActiveEnterTimestampMonotonic --value)"
          test "$after_uninstall" = "$DOCKER_STARTED_AT"
          test -n "$(find /var/backups/server-control-center -maxdepth 1 -name 'uninstall-*.tar.gz' -print -quit)"

      - name: Remove test sentinel
        if: always()
        run: docker rm -f scc-launch-sentinel >/dev/null 2>&1 || true

  capture-dashboard-preview:
    name: Capture real SCC UI preview (mock telemetry)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'launch/preparation'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start SCC with synthetic telemetry
        run: |
          set -euo pipefail
          METRICS_PROVIDER=mock NODE_ENV=development PORT=4173 \
            npm run dev -- --host 127.0.0.1 > /tmp/scc-preview.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scc-preview.log
          exit 1

      - name: Capture dashboard screenshot
        run: |
          set -euo pipefail
          if [[ -s docs/screenshots/dashboard-preview.png ]]; then
            echo "Keeping the existing captured dashboard preview."
            exit 0
          fi
          npx --yes playwright@latest install --with-deps chromium
          mkdir -p docs/screenshots
          npx --yes playwright@latest screenshot \
            --browser chromium \
            --viewport-size "1600,900" \
            --wait-for-timeout 7000 \
            http://127.0.0.1:4173 \
            docs/screenshots/dashboard-preview.png
          test -s docs/screenshots/dashboard-preview.png

      - name: Commit generated preview to the launch branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard-preview.png
          if git diff --cached --quiet; then
            echo "Dashboard preview is already up to date."
            exit 0
          fi
          git commit -m "docs: add captured dashboard preview"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_HEAD_REF"

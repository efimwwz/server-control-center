name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --tag server-control-center:ci .

      - name: Check shell scripts
        run: bash -n install.sh deploy/install.sh deploy/uninstall.sh

      - name: Check Python agent syntax
        run: python3 -m py_compile deploy/host-agent/*.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

name: Temporary removal of obsolete v1.1.0 tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and remove the old tag
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null; then
            echo "Tag v1.1.0 is already absent."
          else
            git push origin --delete v1.1.0
          fi

      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-delete-v110.yml .remove-v1.1.0-trigger
          git commit -m "chore: remove temporary tag cleanup workflow"
          git push origin HEAD:main

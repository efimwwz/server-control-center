name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check and build
        run: |
          npm run lint
          npm run build

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node -e 'const p=require("./package.json"); if(p.version!==process.argv[1]) process.exit(1)' "$VERSION"
          python3 - "$VERSION" <<'PY'
          import json, sys
          with open("package-lock.json", encoding="utf-8") as f:
              lock = json.load(f)
          with open("deploy/host-agent/agent.py", encoding="utf-8") as f:
              agent = f.read()
          with open("server/apiRoutes.ts", encoding="utf-8") as f:
              api = f.read()
          version = sys.argv[1]
          assert lock["version"] == version
          assert lock["packages"][""]["version"] == version
          assert f'"version": "{version}"' in agent
          assert f"version: '{version}'" in api
          PY
          bash -n install.sh deploy/install.sh deploy/uninstall.sh
          python3 -m py_compile deploy/host-agent/*.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/efimwwz/server-control-center
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="server-control-center-${RELEASE_TAG}.tar.gz"
          CHECKSUM="server-control-center-${RELEASE_TAG}.sha256"
          git archive --format=tar --prefix="server-control-center-${RELEASE_TAG}/" "$RELEASE_TAG" | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$CHECKSUM"
          sha256sum -c "$CHECKSUM"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "server-control-center-${RELEASE_TAG}.tar.gz" \
            "server-control-center-${RELEASE_TAG}.sha256" \
            --title "Server Control Center ${RELEASE_TAG}" \
            --generate-notes

name: Temporary npm audit remediation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Update compatible vulnerable dependencies
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high

      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && {
            echo "No dependency updates were produced."
            exit 1
          }
          git commit -m "fix: update vulnerable npm dependencies"
          git push origin HEAD:main
